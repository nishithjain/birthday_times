{% macro newspaper_illustration(slot_name, placeholder) -%}
{% set item = (chronicle.illustrations or {}).get(slot_name) %}
{% if item and item.displayPath %}
<img src="{{ url_for('static', filename=item.displayPath) }}" alt=""
    class="chronicle-era-illustration newspaper-illustration{% if item.variantPath %} chronicle-processed-illustration{% endif %}">
{% else %}
<div class="image-placeholder">{{ placeholder }}</div>
{% endif %}
{%- endmacro %}
