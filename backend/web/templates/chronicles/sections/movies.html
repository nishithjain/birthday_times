<article class="chronicle-section chronicle-movies article-movies" data-section="movies">
    <div class="article-header">
        <h2 class="article-headline">At The Movies</h2>
    </div>
    {% if chronicle.movies.available %}
    <div class="movies-content movies-fit-pending" data-movies-fit-content>
        <div class="movie-list movie-secondary-list">
            {% for movie in chronicle.movies.candidates %}
            <div class="movie-item" data-movie-item>
                <strong>{{ movie.title }}</strong> ({{ movie.year }}){% if movie.credit %} &mdash; {{ movie.credit }}{%
                endif %}
            </div>
            {% endfor %}
        </div>
    </div>
    <script type="application/json" data-movie-candidates>{{ chronicle.movies.candidates|tojson }}</script>
    {% else %}
    <p class="article-body placeholder-text">Historical movie data not available for this year.</p>
    {% endif %}
</article>
